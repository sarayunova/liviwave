name: CI

# The quality gate (`cargo xtask ci`) on a self-hosted runner (label `liviwave-local`), so it costs
# no GitHub-hosted minutes. Start the runner first (see docs/self-hosted-runner.md); while it is
# offline the job waits in the queue. Pushes to main and manual runs only.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: [self-hosted, Windows, liviwave-local]
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # LIVIWAVE_VCVARS (the Visual Studio x64 environment script) and CARGO_TARGET_DIR (the
      # persistent build cache) come from the runner's own .env file, not from this repository.
      - name: cargo xtask ci
        shell: cmd
        run: |
          call "%LIVIWAVE_VCVARS%" >nul || exit /b 1
          cargo xtask ci
